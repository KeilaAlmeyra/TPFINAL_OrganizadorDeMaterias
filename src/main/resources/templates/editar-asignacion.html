
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modificar asignación</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #FFF7E6;
            color: #2D3A47;
        }

        .contenedor {
            max-width: 750px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .descripcion {
            color: #65717D;
            line-height: 1.5;
            margin: 0 0 24px;
        }

        .panel {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        /* VOLVER AL INICIO */

        .volver-inicio {
            display: inline-block;
            margin-bottom: 25px;
            padding: 12px 19px;
            background: #A9B7C6;
            color: #2D3A47;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .volver-inicio:hover {
            background: #91A2B4;
        }

        /* CAMPOS */

        .campo {
            margin-top: 22px;
            min-width: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select,
        input[type="time"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #D8CEBA;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background: white;
            color: #2D3A47;
        }

        select:focus,
        input[type="time"]:focus {
            outline: 2px solid #A9B7C6;
            border-color: #65717D;
        }

        /* DÍAS */

        .dias {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .dia {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 14px;
            background: #FFFCF5;
            border: 1px solid #E8E0CF;
            border-radius: 8px;
            font-weight: normal;
            cursor: pointer;
        }

        .dia input {
            margin: 0;
            accent-color: #2D3A47;
            cursor: pointer;
        }

        .dia span {
            margin: 0;
        }

        /* HORARIOS */

        .horarios {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        /* ACCIONES */

        .acciones {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button,
        .volver {
            border: none;
            border-radius: 8px;
            padding: 12px 19px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .guardar {
            background: #A9B7C6;
            color: #2D3A47;
        }

        .guardar:hover {
            background: #91A2B4;
        }

        .volver {
            background: #F7C8D3;
            color: #8B3947;
        }

        .volver:hover {
            background: #EDB3C0;
        }

        @media (max-width: 550px) {
            body {
                padding: 15px;
            }

            .panel {
                padding: 17px;
            }

            h1 {
                font-size: 25px;
            }

            .horarios {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .acciones {
                flex-direction: column;
            }

            .acciones button,
            .acciones a {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <!-- VOLVER AL INICIO -->
    <a th:href="@{/}" class="volver-inicio">
        Volver al inicio
    </a>

    <!-- ENCABEZADO Y FORMULARIO -->
    <h1>Modificar asignación</h1>

    <p class="descripcion">
        Modificá el espacio, los días o el horario de esta asignación.
        Los cambios se guardarán únicamente si no existen conflictos.
    </p>

    <div class="panel">

        <form th:action="@{/asignaciones/{id}/editar(id=${asignacion.id})}"
              method="post">

            <!-- ESPACIO -->
            <div class="campo">
                <label>Espacio</label>

                <select name="espacioId" required>
                    <option th:each="espacio : ${espaciosDisponibles}"
                            th:value="${espacio.id}"
                            th:text="${espacio.nombre}"
                            th:selected="${espacio.id == asignacion.espacio.id}">
                        Espacio
                    </option>
                </select>
            </div>

            <!-- DÍAS -->
            <div class="campo">
                <label>Días asignados</label>

                <div class="dias">
                    <label class="dia" th:each="dia : ${diasSemana}">
                        <input type="checkbox"
                               name="dias"
                               th:value="${dia}"
                               th:checked="${asignacion.diasAsignados.contains(dia)}">

                        <span th:switch="${dia.toString()}">
                            <span th:case="'MONDAY'">Lunes</span>
                            <span th:case="'TUESDAY'">Martes</span>
                            <span th:case="'WEDNESDAY'">Miércoles</span>
                            <span th:case="'THURSDAY'">Jueves</span>
                            <span th:case="'FRIDAY'">Viernes</span>
                            <span th:case="'SATURDAY'">Sábado</span>
                            <span th:case="'SUNDAY'">Domingo</span>
                        </span>
                    </label>
                </div>
            </div>

            <!-- HORARIOS -->
            <div class="horarios">

                <div class="campo">
                    <label for="horaInicio">Hora de inicio</label>

                    <input type="time"
                           id="horaInicio"
                           name="horaInicio"
                           th:value="${asignacion.horaInicioAsignada}"
                           required>
                </div>

                <div class="campo">
                    <label for="horaFin">Hora de finalización</label>

                    <input type="time"
                           id="horaFin"
                           name="horaFin"
                           th:value="${asignacion.horaFinAsignada}"
                           required>
                </div>

            </div>

            <!-- ACCIONES -->
            <div class="acciones">

                <button type="submit" class="guardar">
                    Guardar cambios
                </button>

                <a th:href="@{/mis-asignaciones}" class="volver">
                    Volver a mis asignaciones
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
