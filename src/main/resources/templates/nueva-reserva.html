
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reservar espacio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #FFF7E6;
            color: #2D3A47;
        }

        main {
            max-width: 750px;
            margin: 0 auto;
        }

        .volver {
            display: inline-block;
            margin-bottom: 25px;
            padding: 12px 19px;
            background: #A9B7C6;
            color: #2D3A47;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .volver:hover {
            background: #91A2B4;
        }

        h1 {
            font-size: 30px;
            margin: 0 0 10px;
        }

        h2 {
            color: #2D3A47;
            font-size: 22px;
            margin: 0 0 20px;
        }

        .descripcion {
            color: #65717D;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        section {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #D8CEBA;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background: white;
            color: #2D3A47;
        }

        input:focus,
        select:focus {
            outline: 2px solid #A9B7C6;
        }

        .fila {
            display: flex;
            gap: 16px;
        }

        .fila > div {
            flex: 1;
            min-width: 0;
        }

        button {
            background: #A9B7C6;
            color: #2D3A47;
            border: none;
            border-radius: 8px;
            padding: 12px 19px;
            margin-top: 22px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #91A2B4;
        }

        .mensaje {
            padding: 13px 16px;
            border-radius: 9px;
            margin-bottom: 18px;
        }

        .ok {
            background: #DDEBD5;
            color: #355B32;
        }

        .error {
            background: #F7C8D3;
            color: #8B3947;
        }

        .usuario {
            background: #FFFCF5;
            border-left: 4px solid #C7A85B;
            padding: 13px 16px;
            border-radius: 8px;
            color: #65717D;
            margin-bottom: 20px;
        }

        .usuario strong {
            color: #2D3A47;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            section {
                padding: 17px;
            }

            h1 {
                font-size: 25px;
            }

            .fila {
                flex-direction: column;
                gap: 0;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<main>

    <a th:href="@{/}" class="volver">Volver al inicio</a>

    <h1>Reservar un espacio</h1>

    <p class="descripcion">
        Realizá una reserva puntual de un aula o espacio de la facultad.
    </p>

    <section>
        <h2>Nueva reserva</h2>

        <div th:if="${ok}" class="mensaje ok" th:text="${ok}"></div>
        <div th:if="${error}" class="mensaje error" th:text="${error}"></div>

        <p class="usuario">
            Reservando como:
            <strong th:text="${usuario}"></strong>
        </p>

        <form method="post" th:action="@{/reservar}">

            <label for="espacio">Espacio</label>
            <select id="espacio" name="espacio" required>
                <option value="">Elegí un espacio</option>
                <option th:each="espacio : ${espaciosDisponibles}"
                        th:value="${espacio.id}"
                        th:text="|${espacio.nombre} (${espacio.capacidadMaxima} personas)|">
                </option>
            </select>

            <label for="tipoActividad">Tipo de actividad</label>
            <select id="tipoActividad" name="tipoActividad" required>
                <option value="">Elegí el tipo de actividad</option>
                <option th:each="tipo : ${tiposActividad}"
                        th:value="${tipo}"
                        th:text="${tipo.descripcion}">
                </option>
            </select>

            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha"
                   th:min="${hoy}" required>

            <div class="fila">
                <div>
                    <label for="horaInicio">Hora de inicio</label>
                    <select id="horaInicio" name="horaInicio" required>
                        <option value="">Elegí una hora</option>
                        <th:block th:each="h : ${#numbers.sequence(8, 21)}">
                            <option th:value="${#numbers.formatInteger(h, 2) + ':00'}"
                                    th:text="${#numbers.formatInteger(h, 2) + ':00'}"></option>
                            <option th:value="${#numbers.formatInteger(h, 2) + ':30'}"
                                    th:text="${#numbers.formatInteger(h, 2) + ':30'}"></option>
                        </th:block>
                    </select>
                </div>

                <div>
                    <label for="horaFin">Hora de fin</label>
                    <select id="horaFin" name="horaFin" required>
                        <option value="">Elegí una hora</option>
                        <th:block th:each="h : ${#numbers.sequence(8, 21)}">
                            <option th:value="${#numbers.formatInteger(h, 2) + ':30'}"
                                    th:text="${#numbers.formatInteger(h, 2) + ':30'}"></option>
                            <option th:value="${#numbers.formatInteger(h + 1, 2) + ':00'}"
                                    th:text="${#numbers.formatInteger(h + 1, 2) + ':00'}"></option>
                        </th:block>
                    </select>
                </div>
            </div>

            <button type="submit">Confirmar reserva</button>
        </form>
    </section>

</main>

</body>
</html>
