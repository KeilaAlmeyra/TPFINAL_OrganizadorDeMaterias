
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis reservas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #FFF7E6;
            color: #2D3A47;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
        }

        .volver {
            display: inline-block;
            margin-bottom: 25px;
            padding: 12px 19px;
            background: #A9B7C6;
            color: #2D3A47;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .volver:hover {
            background: #91A2B4;
        }

        h1 {
            font-size: 30px;
            margin: 0 0 10px;
        }

        .descripcion {
            color: #65717D;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        section {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 13px 12px;
            text-align: left;
            border-bottom: 1px solid #E8E0CF;
        }

        th {
            background: #F7C8D3;
            color: #2D3A47;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        tbody tr:hover {
            background: #FFFCF5;
        }

        button {
            background: #B46A72;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 9px 14px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover {
            background: #98545D;
        }

        .estado {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .confirmada {
            background: #DDEBD5;
            color: #355B32;
        }

        .pendiente {
            background: #FFF0C2;
            color: #805900;
        }

        .rechazada {
            background: #F7C8D3;
            color: #8B3947;
        }

        .cancelada {
            background: #E5E7EB;
            color: #444444;
        }

        .mensaje {
            padding: 13px 16px;
            border-radius: 9px;
            margin-bottom: 18px;
        }

        .ok {
            background: #DDEBD5;
            color: #355B32;
        }

        .error {
            background: #F7C8D3;
            color: #8B3947;
        }

        .vacio {
            text-align: center;
            padding: 24px;
            color: #65717D;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            section {
                padding: 17px;
                overflow-x: auto;
            }

            h1 {
                font-size: 25px;
            }

            table {
                min-width: 950px;
            }
        }
    </style>
</head>

<body>

<main>

    <a th:href="@{/}" class="volver">Volver al inicio</a>

    <h1 th:text="${esAdministrador} ? 'Todas las reservas' : 'Mis reservas'">
        Mis reservas
    </h1>

    <p class="descripcion">
        Consultá las reservas y solicitudes registradas, junto con su estado.
    </p>

    <section>

        <div th:if="${ok}" class="mensaje ok" th:text="${ok}"></div>
        <div th:if="${error}" class="mensaje error" th:text="${error}"></div>

        <table>
            <thead>
            <tr>
                <th>Código</th>
                <th>Espacio</th>
                <th>Fecha</th>
                <th>Horario</th>
                <th>Reservado por</th>
                <th>Estado</th>
                <th>Motivo</th>
                <th>Acción</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="reserva : ${reservas}">
                <td th:text="|R-${reserva.id}|"></td>

                <td th:text="${reserva.espacio.nombre}"></td>

                <td th:text="${#temporals.format(reserva.fecha, 'dd/MM/yyyy')}"></td>

                <td th:text="|${#temporals.format(reserva.horaInicio, 'HH:mm')} - ${#temporals.format(reserva.horaFin, 'HH:mm')}|"></td>

                <td th:text="${reserva.reservadoPor}"></td>

                <td>
                    <span class="estado"
                          th:classappend="${#strings.toLowerCase(reserva.estado)}"
                          th:text="${reserva.estado}">
                    </span>
                </td>

                <td th:text="${reserva.motivo != null ? reserva.motivo : '-'}"></td>

                <td>
                    <form th:if="${reserva.estado == 'CONFIRMADA' or reserva.estado == 'PENDIENTE'}"
                          method="post"
                          th:action="@{/reservas/{id}/cancelar(id=${reserva.id})}"
                          onsubmit="return confirm('¿Cancelar esta solicitud o reserva?');">
                        <button type="submit">Cancelar</button>
                    </form>

                    <span th:if="${reserva.estado == 'RECHAZADA' or reserva.estado == 'CANCELADA'}">
                        -
                    </span>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(reservas)}">
                <td colspan="8" class="vacio">
                    No hay reservas ni solicitudes para mostrar.
                </td>
            </tr>
            </tbody>
        </table>

    </section>

</main>

</body>
</html>
