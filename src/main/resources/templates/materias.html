
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administración de materias</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #FFF7E6;
            color: #2D3A47;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
        }

        .volver {
            display: inline-block;
            margin-bottom: 25px;
            padding: 12px 19px;
            background: #A9B7C6;
            color: #2D3A47;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .volver:hover {
            background: #91A2B4;
        }

        h1 {
            font-size: 30px;
            margin: 0 0 10px;
        }

        h2 {
            color: #2D3A47;
            font-size: 22px;
            margin: 0 0 20px;
        }

        .descripcion {
            color: #65717D;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        section {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        input:not([type="checkbox"]),
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #D8CEBA;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background: white;
            color: #2D3A47;
        }

        input:focus,
        select:focus {
            outline: 2px solid #A9B7C6;
        }

        button {
            background: #A9B7C6;
            color: #2D3A47;
            border: none;
            border-radius: 8px;
            padding: 12px 19px;
            margin-top: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #91A2B4;
        }

        .secundario {
            background: #A9B7C6;
            color: #2D3A47;
        }

        .secundario:hover {
            background: #91A2B4;
        }

        .eliminar {
            background: #B46A72;
            color: white;
        }

        .eliminar:hover {
            background: #98545D;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 13px 12px;
            text-align: left;
            border-bottom: 1px solid #E8E0CF;
        }

        th {
            background: #F7C8D3;
            color: #2D3A47;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        tbody tr:hover {
            background: #FFFCF5;
        }

        .mensaje {
            padding: 13px 16px;
            border-radius: 9px;
            margin-bottom: 18px;
        }

        .ok {
            background: #DDEBD5;
            color: #355B32;
        }

        .error {
            background: #F7C8D3;
            color: #8B3947;
        }

        .acciones {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .acciones form {
            margin: 0;
        }

        .acciones button {
            margin-top: 0;
        }

        .acciones a {
            text-decoration: none;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .checkbox input {
            width: 17px;
            height: 17px;
            margin: 0;
            accent-color: #A9B7C6;
            cursor: pointer;
        }

        .checkbox label {
            margin: 0;
            cursor: pointer;
        }

        .cancelar {
            display: inline-block;
            margin-left: 12px;
            color: #65717D;
            font-size: 14px;
            text-decoration: none;
        }

        .cancelar:hover {
            text-decoration: underline;
        }

        .vacio {
            text-align: center;
            padding: 22px;
            color: #65717D;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            section {
                padding: 17px;
                overflow-x: auto;
            }

            h1 {
                font-size: 25px;
            }

            table {
                min-width: 750px;
            }

            .acciones {
                flex-direction: column;
                align-items: flex-start;
            }

            .cancelar {
                display: inline-block;
                margin: 15px 0 0;
            }
        }
    </style>
</head>

<body>

<main>

    <a th:href="@{/}" class="volver">Volver al inicio</a>

    <h1>Administración de materias</h1>
    <p class="descripcion">
        Desde aca se puede registrar, modificar y administrar las materias de la carrera.
    </p>

    <p class="mensaje ok" th:if="${ok}" th:text="${ok}"></p>
    <p class="mensaje error" th:if="${error}" th:text="${error}"></p>

    <section id="formulario">

        <h2 th:text="${materiaEditar != null
                ? 'Modificar materia'
                : 'Registrar nueva materia'}">
            Registrar nueva materia
        </h2>

        <form method="post" th:action="@{/materias/guardar}">

            <label for="id">Código identificador</label>
            <input id="id"
                   name="id"
                   type="text"
                   required
                   th:value="${materiaEditar != null
                       ? materiaEditar.id : ''}"
                   th:readonly="${materiaEditar != null}">

            <label for="nombre">Nombre</label>
            <input id="nombre"
                   name="nombre"
                   type="text"
                   required
                   th:value="${materiaEditar != null
                       ? materiaEditar.nombre : ''}">

            <label for="cargaHoraria">Carga horaria semanal</label>
            <input id="cargaHoraria"
                   name="cargaHoraria"
                   type="number"
                   min="1"
                   required
                   th:value="${materiaEditar != null
                       ? materiaEditar.cargaHoraria : ''}">

            <label for="anioCarrera">Año de carrera</label>
            <input id="anioCarrera"
                   name="anioCarrera"
                   type="number"
                   min="1"
                   required
                   th:value="${materiaEditar != null
                       ? materiaEditar.anioCarrera : ''}">

            <label for="tipoEspacioFrecuente">
                Tipo de espacio frecuente
            </label>

            <select id="tipoEspacioFrecuente"
                    name="tipoEspacioFrecuente"
                    required>

                <option value="">Seleccionar tipo</option>

                <option value="aula"
                        th:selected="${materiaEditar != null
                            and materiaEditar.tipoEspacioFrecuente == 'aula'}">
                    Aula común
                </option>

                <option value="computadoras"
                        th:selected="${materiaEditar != null
                            and materiaEditar.tipoEspacioFrecuente == 'computadoras'}">
                    Aula con computadoras
                </option>

                <option value="laboratorio"
                        th:selected="${materiaEditar != null
                            and materiaEditar.tipoEspacioFrecuente == 'laboratorio'}">
                    Laboratorio
                </option>

            </select>

            <div class="checkbox">
                <input id="troncal"
                       name="troncal"
                       type="checkbox"
                       value="true"
                       th:checked="${materiaEditar != null
                           and materiaEditar.troncal}">
                <label for="troncal">
                    Materia troncal
                </label>
            </div>

            <button type="submit"
                    th:text="${materiaEditar != null
                        ? 'Guardar cambios' : 'Registrar materia'}">
                Registrar materia
            </button>

            <a th:if="${materiaEditar != null}"
               th:href="@{/materias}"
               class="cancelar">
                Cancelar edición
            </a>

        </form>

    </section>

    <section>

        <h2>Materias registradas</h2>

        <table>
            <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Carga horaria</th>
                <th>Año</th>
                <th>Troncal</th>
                <th>Tipo de espacio</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="materia : ${materias}">

                <td th:text="${materia.id}"></td>
                <td th:text="${materia.nombre}"></td>
                <td th:text="${materia.cargaHoraria}"></td>
                <td th:text="${materia.anioCarrera}"></td>

                <td th:text="${materia.troncal ? 'Sí' : 'No'}"></td>

                <td th:text="${materia.tipoEspacioFrecuente}"></td>

                <td>
                    <div class="acciones">

                        <<form method="get" th:action="@{/materias#formulario}">
                        <input type="hidden" name="editar" th:value="${materia.id}">
                        <button type="submit">Editar</button>
                    </form>

                        <form method="post"
                              th:action="@{/materias/eliminar/{id}(id=${materia.id})}"
                              onsubmit="return confirm('¿Seguro que desea eliminar esta materia?');">

                            <button type="submit" class="eliminar">
                                Eliminar
                            </button>

                        </form>

                    </div>
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(materias)}">
                <td colspan="7" class="vacio">
                    Todavía no hay materias registradas.
                </td>
            </tr>

            </tbody>
        </table>

    </section>

</main>

</body>
</html>
