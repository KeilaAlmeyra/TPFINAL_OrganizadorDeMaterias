
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Organizador de Aulas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #E8E0CF;
            color: #222222;
            font-family: Arial, sans-serif;
        }

        .contenedor {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            color: #163A61;
            text-align: center;
            font-size: 25px;
        }

        .descripcion {
            margin-bottom: 28px;
            color: #555;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 5px;
            background: #163A61;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #244e79;
        }

        .mensaje {
            margin-bottom: 18px;
            padding: 11px;
            border-radius: 5px;
            text-align: center;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }

        .exito {
            background: #d1e7dd;
            color: #0f5132;
        }
    </style>
</head>

<body>
<main class="contenedor">
    <h1>Organizador de Materias</h1>
    <p class="descripcion">Ingresá con tu cuenta para continuar.</p>

    <div th:if="${param.error}" class="mensaje error">
        Correo o contraseña incorrectos.
    </div>

    <div th:if="${param.logout}" class="mensaje exito">
        Cerraste sesión correctamente.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="username">Correo electrónico</label>
        <input
                type="email"
                id="username"
                name="username"
                placeholder="correo@universidad.edu"
                required
                autofocus
        >

        <label for="password">Contraseña</label>
        <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresá tu contraseña"
                required
        >

        <button type="submit">Iniciar sesión</button>
    </form>
</main>
</body>
</html>
