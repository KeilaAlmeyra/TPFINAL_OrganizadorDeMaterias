
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Organizador de Materias</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #E8E0CF;
            color: #222222;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 1000px;
            margin: auto;
        }

        h1, h2 {
            color: #163A61;
        }

        .panel {
            margin-bottom: 25px;
            padding: 25px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            margin-top: 18px;
            padding: 11px 20px;
            border: none;
            border-radius: 5px;
            background: #163A61;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #244e79;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #163A61;
            color: white;
        }

        .mensaje {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 5px;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }

        .ok {
            background: #d1e7dd;
            color: #0f5132;
        }

        .volver {
            display: inline-block;
            margin-bottom: 20px;
            color: #163A61;
        }
    </style>
</head>

<body>
<main>

    <a class="volver" th:href="@{/}">← Volver al inicio</a>

    <h1>Administración de usuarios</h1>
    <p>Desde aquí podés registrar y consultar los profesores del sistema.</p>

    <section class="panel">
        <h2>Registrar profesor</h2>

        <div th:if="${error}" class="mensaje error" th:text="${error}"></div>
        <div th:if="${ok}" class="mensaje ok" th:text="${ok}"></div>

        <form th:action="@{/usuarios/registrar}" method="post">

            <label for="nombre">Nombre completo</label>
            <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    maxlength="120"
                    required
            >

            <label for="correo">Correo electrónico</label>
            <input
                    type="email"
                    id="correo"
                    name="correo"
                    maxlength="150"
                    required
            >

            <label for="contrasena">Contraseña inicial</label>
            <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    minlength="12"
                    required
            >

            <button type="submit">Registrar profesor</button>
        </form>
    </section>

    <section class="panel">
        <h2>Usuarios registrados</h2>

        <table>
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Rol</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.nombre}"></td>
                <td th:text="${usuario.correo}"></td>
                <td th:text="${usuario.rol}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="3">Todavía no hay usuarios registrados.</td>
            </tr>
            </tbody>
        </table>
    </section>

</main>
</body>
</html>
