# Base de datos H2 guardada en un archivo (carpeta ./data).
# Los datos se conservan aunque se apague la aplicación.
spring.datasource.url=jdbc:h2:file:./data/organizador
spring.datasource.username=sa
spring.datasource.password=

# Crea o actualiza las tablas solas a partir de las clases @Entity.
spring.jpa.hibernate.ddl-auto=update

# Consola web para ver las tablas: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Integracion con SWI-Prolog (ajustar la ruta si esta instalado en otro directorio).
prolog.ejecutable=${PROLOG_EJECUTABLE:C:/Program Files/swipl/bin/swipl.exe}
prolog.archivo=${PROLOG_ARCHIVO:src/main/prolog/organizador.pl}
